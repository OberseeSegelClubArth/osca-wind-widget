<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windprognose Zugersee – OSCA</title>
<style>
:root{--ink:#10283e;--muted:#617286;--line:#dbe5ec;--soft:#f4f8fb;--accent:#00689d;--gust:#e36b2c}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:#fff}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:1100px;margin:auto;background:#fff}
header{padding:18px 20px 12px;display:flex;gap:18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px;min-width:0}.brand img{width:230px;max-width:35vw;height:auto;display:block}.brand-copy{min-width:0}h1{font-size:21px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted)}
.badge{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--soft);white-space:nowrap}
.location-tabs{display:flex;gap:5px;padding:0 20px 13px;overflow-x:auto;scrollbar-width:thin}
.location-tabs button{white-space:nowrap;border-radius:999px;padding:8px 13px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 20px 14px;flex-wrap:wrap}.details-button{background:var(--ink);color:#fff;border-color:var(--ink)}.details-button:hover{background:#173b5b;color:#fff}
.hours{display:flex;gap:8px}.details-button{display:flex;align-items:center;gap:6px}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;color:var(--ink);font:inherit}
button:hover{background:var(--soft)}
button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metric{background:#fff;padding:13px 16px}.metric b{display:block;font-size:22px}.metric span{font-size:12px;color:var(--muted)}
.chartwrap{padding:16px 14px 4px;overflow-x:auto}.chart{min-width:760px;height:320px;position:relative}
svg{width:100%;height:100%;display:block}.grid{stroke:#e5edf2;stroke-width:1}.axis{fill:var(--muted);font-size:11px}
.wind{fill:none;stroke:#0078a8;stroke-width:3}.gust{fill:none;stroke:var(--gust);stroke-width:3}
.legend{display:flex;gap:17px;padding:0 20px 14px;font-size:12px;color:var(--muted)}
.key:before{content:"";width:12px;height:3px;display:inline-block;margin-right:6px;vertical-align:middle;background:#0078a8}.key.g:before{background:var(--gust)}
.tablewrap{overflow:auto;border-top:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid #edf2f5;text-align:right}th:first-child,td:first-child{text-align:left}
.hidden{display:none}
footer{padding:11px 16px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
a{color:var(--accent)}.error{padding:30px;color:#9b2c2c}.arrow{display:inline-block;font-size:17px}
@media(max-width:650px){
  .summary{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}
  header{display:block}.brand{display:block}.brand img{width:185px;max-width:70vw;margin-bottom:10px}.badge{display:inline-block;margin-top:8px}
  .location-tabs,.toolbar{padding-left:12px;padding-right:12px}
  footer{display:block}footer a{display:inline-block;margin-top:7px}
}
</style>
</head>
<body>
<div class="card">
  <header>
    <div class="brand">
      <img src="osca-logo.jpg" alt="OSCA – Obersee Segelclub Arth">
      <div class="brand-copy">
        <h1 id="title">Windprognose Zugersee</h1>
        <div class="sub" id="subtitle">Wind und Böen an wichtigen Segelstandorten</div>
      </div>
    </div>
    <div class="badge" id="status">Lade MeteoSwiss…</div>
  </header>

  <nav class="location-tabs" id="locationTabs" aria-label="Standort wählen"></nav>

  <div class="toolbar">
    <div class="hours">
      <button data-hours="24" class="active">24 Std.</button>
      <button data-hours="48">48 Std.</button>
      <button data-hours="72">72 Std.</button>
    </div>
    <button class="details-button" id="detailsButton" aria-expanded="false">
      Zeit &amp; Richtung anzeigen
    </button>
  </div>

  <div id="content"></div>

  <footer>
    <span>Quelle: MeteoSchweiz · Aktualisierung stündlich</span>
    <a id="sourceLink" target="_blank" rel="noopener">Detailprognose öffnen</a>
  </footer>
</div>

<script>
const API="./forecast.json";
let locations=[];
let activeId="arth";
let selectedHours=24;
let detailsOpen=false;

document.querySelectorAll("[data-hours]").forEach(button=>{
  button.addEventListener("click",()=>{
    selectedHours=Number(button.dataset.hours);
    document.querySelectorAll("[data-hours]").forEach(item=>
      item.classList.toggle("active",item===button)
    );
    render();
  });
});

document.getElementById("detailsButton").addEventListener("click",()=>{
  detailsOpen=!detailsOpen;
  const button=document.getElementById("detailsButton");
  button.setAttribute("aria-expanded",String(detailsOpen));
  button.textContent=detailsOpen
    ?"Zeit & Richtung ausblenden"
    :"Zeit & Richtung anzeigen";
  render();
});

fetch(API+"?v="+Date.now())
  .then(response=>{
    if(!response.ok)throw new Error("HTTP "+response.status);
    return response.json();
  })
  .then(data=>{
    if(data.error)throw new Error(data.error);
    locations=data.locations||[];
    if(!locations.length)throw new Error("Keine Standortdaten vorhanden");
    if(!locations.some(location=>location.id===activeId))activeId=locations[0].id;
    document.getElementById("status").textContent=
      "Live · "+new Date(data.updated_at).toLocaleTimeString("de-CH",{
        hour:"2-digit",minute:"2-digit"
      });
    renderTabs();
    render();
  })
  .catch(error=>{
    document.getElementById("status").textContent="Daten nicht verfügbar";
    document.getElementById("content").innerHTML=
      '<div class="error">Die Live-Daten konnten nicht geladen werden.<br><small>'+
      escapeHtml(error.message)+'</small></div>';
  });

function renderTabs(){
  const tabs=document.getElementById("locationTabs");
  tabs.innerHTML=locations.map(location=>`
    <button
      type="button"
      data-location="${escapeHtml(location.id)}"
      class="${location.id===activeId?"active":""}"
      aria-pressed="${location.id===activeId}">
      ${escapeHtml(location.label)}
    </button>
  `).join("");

  tabs.querySelectorAll("[data-location]").forEach(button=>{
    button.addEventListener("click",()=>{
      activeId=button.dataset.location;
      renderTabs();
      render();
    });
  });
}

function render(){
  const location=locations.find(item=>item.id===activeId);
  if(!location)return;

  const rows=(location.forecast||[]).slice(0,selectedHours);
  document.getElementById("subtitle").textContent=
    `${location.label} · Wind, Böen und Richtung · PLZ ${location.postcode}`;
  document.getElementById("sourceLink").href=location.source_url;

  if(!rows.length){
    document.getElementById("content").innerHTML=
      '<div class="error">Für diesen Standort sind derzeit keine Prognosedaten vorhanden.</div>';
    return;
  }

  const maxG=Math.max(...rows.map(row=>knots(row.gust_kmh)||0));
  const maxW=Math.max(...rows.map(row=>knots(row.wind_kmh)||0));
  const strongest=rows.reduce(
    (a,b)=>(b.gust_kmh||0)>(a.gust_kmh||0)?b:a,
    rows[0]
  );

  document.getElementById("content").innerHTML=`
    <div class="summary">
      <div class="metric"><b>${formatValue(maxW)} kn</b><span>Max. mittlerer Wind</span></div>
      <div class="metric"><b>${formatValue(maxG)} kn</b><span>Max. Böe</span></div>
      <div class="metric"><b>${dateTime(strongest.time)}</b><span>Zeitpunkt stärkste Böe</span></div>
    </div>
    <div class="chartwrap"><div class="chart">${chart(rows)}</div></div>
    <div class="legend"><span class="key">Wind</span><span class="key g">Böen</span></div>
    <div class="tablewrap ${detailsOpen?"":"hidden"}">
      <table>
        <thead><tr><th>Zeit</th><th>Richtung</th><th>Wind</th><th>Böen</th></tr></thead>
        <tbody>${rows.map(row=>`
          <tr>
            <td>${dateTime(row.time)}</td>
            <td><span class="arrow" style="transform:rotate(${row.direction_deg||0}deg)">↓</span> ${compass(row.direction_deg)}</td>
            <td>${formatValue(knots(row.wind_kmh))} kn</td>
            <td><b>${formatValue(knots(row.gust_kmh))} kn</b></td>
          </tr>
        `).join("")}</tbody>
      </table>
    </div>
  `;
}

function chart(rows){
  const W=1000,H=300,p={l:42,r:12,t:16,b:38};
  const max=Math.max(5,...rows.map(row=>knots(row.gust_kmh)||0));
  const x=index=>p.l+index*(W-p.l-p.r)/Math.max(1,rows.length-1);
  const y=value=>p.t+(max-value)*(H-p.t-p.b)/max;
  const path=key=>rows.map((row,index)=>
    (index?"L":"M")+x(index).toFixed(1)+","+y(knots(row[key])||0).toFixed(1)
  ).join(" ");

  let grid="";
  const step=Math.max(5,Math.ceil(max/5/5)*5);
  for(let value=0;value<=max;value+=step){
    grid+=`<line class="grid" x1="${p.l}" x2="${W-p.r}" y1="${y(value)}" y2="${y(value)}"/>
      <text class="axis" x="4" y="${y(value)+4}">${value}</text>`;
  }

  let labels="";
  rows.forEach((row,index)=>{
    if(index%6===0){
      labels+=`<text class="axis" text-anchor="middle" x="${x(index)}" y="${H-12}">
        ${new Date(row.time).toLocaleString("de-CH",{weekday:"short",hour:"2-digit"})}
      </text>`;
    }
  });

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${grid}
    <path class="wind" d="${path("wind_kmh")}"/>
    <path class="gust" d="${path("gust_kmh")}"/>
    ${labels}
  </svg>`;
}

function compass(degrees){
  if(degrees==null)return"–";
  return["N","NO","O","SO","S","SW","W","NW"][Math.round(degrees/45)%8];
}
function knots(value){return value==null?null:value/1.852}
function formatValue(value){return value==null?"–":Math.round(value*10)/10}
function dateTime(time){
  return new Date(time).toLocaleString("de-CH",{
    weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"
  });
}
function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[char]));
}
</script>
</body>
</html>
