name: Update MeteoSwiss forecast and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update forecast data
        run: node scripts/update-forecast.mjs

      - name: Commit refreshed forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/forecast.json
          if git diff --cached --quiet; then
            echo "Forecast unchanged - nothing to commit"
            exit 0
          fi
          git commit -m "Update MeteoSwiss forecast"
          # Push with retry: if another run (or a re-run) pushed first, re-base
          # our freshly generated forecast onto the new tip instead of failing.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - reapplying onto current main"
            git fetch origin main
            git reset --soft origin/main
            git add docs/forecast.json
            if git diff --cached --quiet; then
              echo "Remote already has this forecast - nothing to push"
              exit 0
            fi
            git commit -m "Update MeteoSwiss forecast"
            sleep 5
          done
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
